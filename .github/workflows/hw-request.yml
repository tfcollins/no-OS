name: no-os HW Request (flash)

# Builds a no-os reference project, JTAG-flashes it onto a matching physical
# board via labgrid, and validates it on-target (serial banner) — using the
# low-config no-os hw-request flow from tfcollins/labgrid-plugins. Complements
# the build-only Azure pipeline.
#
# Each leg: build projects/<noos_project> -> `adi-lg request --part <part>
# --mode flash --firmware <.elf>` (selects the board's BootNoOSJTAG strategy,
# xsdb-loads the firmware, asserts the validation banner) -> release.
#
# Discovery: the preflight harvests tools/hw_ci/projects.yaml and intersects it
# with the coordinator's live flash-capable boards; a project with no live board
# is skipped with an annotation.
#
# The reusable workflow's `build-noos` step now owns the whole build: it sources
# each board's HDL `.xsa` from the Kuiper image (no NOOS_XSA_DIR / .xsa staging),
# composes the Vivado/Vitis env (auto-detect settings64.sh + the libtinfo .so.5
# shim + NOOS_VITIS_HSI_FLOW=1), extracts the bitstream + ps7_init, and runs
# make. The per-project validation banner and any extra make vars are declared
# in tools/hw_ci/projects.yaml (validate_banner defaults to
# "Successfully initialized"). So this consumer only supplies four inputs.
#
# ── BEFORE ENABLING, set these repo vars for the lab ──────────────────────────
#   * vars.LG_COORDINATOR       — gRPC coordinator host:port (e.g. host:20408);
#                                 the workflow derives the REST API from it.
#   * vars.HW_REQUEST_RUNNER    — fallback self-hosted label for the per-leg jobs
#   * vars.HW_PREFLIGHT_RUNNER  — self-hosted label that can reach the REST API
# Each leg lands on the runner co-located with its board (the place's `runner`
# tag), falling back to HW_REQUEST_RUNNER. A leg runner only needs Vivado/xsdb
# installed and to be wired to the board's JTAG; lab hosts must be registered as
# runners on THIS repo/org scope (see register-hw-runners.sh --scopes).
# ──────────────────────────────────────────────────────────────────────────────

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  noos-hw-request:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'hw-request')
    uses: tfcollins/labgrid-plugins/.github/workflows/noos-hw-request.yml@main
    with:
      coordinator: ${{ vars.LG_COORDINATOR }}
      manifest: "tools/hw_ci/projects.yaml"
      runner-label: ${{ vars.HW_REQUEST_RUNNER }}
      preflight-runner-label: ${{ vars.HW_PREFLIGHT_RUNNER }}
