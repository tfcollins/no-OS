[pytest]
addopts = -ra
# These markers are also registered by the adi-labgrid-plugins pytest plugin
# (entry point adi_lg_hw_ci); declaring them here lets collection / -m work
# even when the plugin is not installed (e.g. --collect-only dry runs).
markers =
    iio_hardware(names): daughter-board / chip families the test exercises
    iio_carrier(names): FPGA carriers the test supports
